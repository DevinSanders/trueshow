version: 2

# Consolidate all dependency updates (Cargo, npm, and GitHub Actions — major,
# minor, and patch) into a single weekly Dependabot pull request.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

updates:
  # Rust workspace + Tauri desktop crate dependencies.
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/apps/desktop/src-tauri"
    multi-ecosystem-group: "all-dependencies"
    patterns:
      - "*"

  # Svelte 5 + Vite + Tauri CLI frontend packages.
  - package-ecosystem: "npm"
    directory: "/apps/desktop"
    multi-ecosystem-group: "all-dependencies"
    patterns:
      - "*"
    ignore:
      # svelte-check 4.x declares peer dependency typescript "^5.0.0 || ^6.0.0".
      # Hold TypeScript below 7.x until svelte-check supports TS 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  # GitHub Actions workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "all-dependencies"
    patterns:
      - "*"
