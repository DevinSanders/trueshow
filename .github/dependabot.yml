version: 2

# Consolidate all dependency updates (Cargo, npm, and GitHub Actions — major,
# minor, and patch) into a single weekly Dependabot pull request.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

updates:
  # Rust workspace + Tauri desktop crate dependencies.
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/apps/desktop/src-tauri"
    multi-ecosystem-group: "all-dependencies"
    patterns:
      - "*"
    ignore:
      # cosmic-text 0.15+ changed Buffer::set_metrics/set_size/set_text
      # signatures (removed &mut FontSystem, added Option<Align>).
      # Hold on 0.14.x until crates/render-text is migrated.
      - dependency-name: "cosmic-text"
        versions: [">=0.15.0"]
      # symphonia 0.6+ overhauled core::probe, SampleBuffer, CODEC_TYPE_NULL,
      # DecoderOptions, Probe::format, and CodecRegistry::make.
      # Hold on 0.5.x until crates/media-engine is migrated.
      - dependency-name: "symphonia"
        versions: [">=0.6.0"]
      # quick-xml 0.38+ removed BytesText::unescape() used by XML Bible and
      # presentation importers. Hold on 0.37.x until crates/integrations is migrated.
      - dependency-name: "quick-xml"
        versions: [">=0.38.0"]

  # Svelte 5 + Vite + Tauri CLI frontend packages.
  - package-ecosystem: "npm"
    directory: "/apps/desktop"
    multi-ecosystem-group: "all-dependencies"
    patterns:
      - "*"
    ignore:
      # svelte-check 4.x declares peer dependency typescript "^5.0.0 || ^6.0.0".
      # Hold TypeScript below 7.x until svelte-check supports TS 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  # GitHub Actions workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "all-dependencies"
    patterns:
      - "*"
