name: Release

# Push a version tag (e.g. v0.1.0 or v0.1.0-beta.1) — or trigger manually via
# workflow_dispatch — to build cross-platform installers for Windows, macOS,
# and Linux with the decoupled `trueshow-engine` GPU sidecar bundled inside,
# and publish them to a GitHub Release with SHA256SUMS.txt.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release as (e.g. v0.1.0-beta.1). Created if it does not exist.'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Step 1: Build the `trueshow-engine` GPU sidecar and package Tauri 2
  # installers for every desktop target.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build Installer (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            ext: '.exe'
          - os: macos-latest
            label: macOS Apple Silicon
            target: aarch64-apple-darwin
            bundles: dmg
            ext: ''
          - os: macos-latest
            label: macOS Intel
            target: x86_64-apple-darwin
            bundles: dmg
            ext: ''
          - os: ubuntu-latest
            label: Linux x64
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            ext: ''

    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag & version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> apps/desktop/src-tauri/target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux Tauri, graphics & audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libvulkan-dev \
            rpm

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build trueshow-engine sidecar (${{ matrix.target }})
        shell: bash
        run: |
          cargo build --release --bin trueshow-engine --target ${{ matrix.target }}
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/${{ matrix.target }}/release/trueshow-engine${{ matrix.ext }}" \
             "apps/desktop/src-tauri/binaries/trueshow-engine-${{ matrix.target }}${{ matrix.ext }}"

      - name: Write Tauri release config override
        shell: bash
        run: |
          cat > apps/desktop/src-tauri/release-override.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "bundle": {
              "active": true,
              "externalBin": ["binaries/trueshow-engine"]
            }
          }
          EOF

      - name: Build TrueShow installers (${{ matrix.bundles }})
        working-directory: apps/desktop
        shell: bash
        env:
          # Build unsigned in CI unless signing secrets are explicitly configured.
          CI: true
          # Avoid Ubuntu 24.04 linuxdeploy strip failure on newer ELF .relr.dyn sections.
          NO_STRIP: true
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          npx tauri build \
            --target ${{ matrix.target }} \
            --bundles ${{ matrix.bundles }} \
            --config src-tauri/release-override.json

      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          BUNDLE_DIR="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$BUNDLE_DIR" -maxdepth 2 -type f \( \
            -name "*.exe" -o \
            -name "*.msi" -o \
            -name "*.dmg" -o \
            -name "*.deb" -o \
            -name "*.rpm" -o \
            -name "*.AppImage" \
          \) -exec cp -v {} release-assets/ \;

          echo "Collected assets for ${{ matrix.label }}:"
          ls -lh release-assets/
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::No installer artifacts found in $BUNDLE_DIR"
            exit 1
          fi

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Step 2: Generate SHA256SUMS.txt, build release notes (PR categories +
  # direct-commit fallback), and publish the GitHub Release.
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full git history for release notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve tag & prerelease flag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Generate release notes (PRs via .github/release.yml + direct commits)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            RANGE_END="${TAG}"
            PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          else
            RANGE_END="HEAD"
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          fi

          # 1. Ask GitHub to generate categorized PR notes using .github/release.yml
          API_ARGS=(-f "tag_name=${TAG}" -f "target_commitish=${GITHUB_SHA}")
          if [[ -n "$PREV_TAG" ]]; then
            API_ARGS+=(-f "previous_tag_name=${PREV_TAG}")
          fi
          PR_NOTES=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${API_ARGS[@]}" --jq '.body' 2>/dev/null || true)

          # 2. Collect non-merge direct commits not already listed via a PR reference (#123)
          if [[ -n "$PREV_TAG" ]]; then
            LOG_RANGE="${PREV_TAG}..${RANGE_END}"
          else
            LOG_RANGE="${RANGE_END}"
          fi

          FEAT_LINES=""
          FIX_LINES=""
          OTHER_LINES=""
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            HASH="${line%% *}"
            SUBJ="${line#* }"
            # Skip commits already covered in GitHub's PR notes via (#NNN)
            if [[ "$SUBJ" =~ \(#([0-9]+)\) ]] && grep -qE "pull/${BASH_REMATCH[1]}\b|#${BASH_REMATCH[1]}\b" <<< "$PR_NOTES"; then
              continue
            fi
            ENTRY="- ${SUBJ} (\`${HASH}\`)"
            if [[ "$SUBJ" =~ ^feat(\([^)]+\))?: ]]; then
              FEAT_LINES+="${ENTRY}"$'\n'
            elif [[ "$SUBJ" =~ ^fix(\([^)]+\))?: ]]; then
              FIX_LINES+="${ENTRY}"$'\n'
            else
              OTHER_LINES+="${ENTRY}"$'\n'
            fi
          done < <(git log "${LOG_RANGE}" --no-merges --pretty=format:"%h %s")

          {
            if [[ -n "$PR_NOTES" ]]; then
              printf '%s\n\n' "$PR_NOTES"
            fi

            if [[ -n "$FEAT_LINES" || -n "$FIX_LINES" || -n "$OTHER_LINES" ]]; then
              echo "## Commits Included"
              if [[ -n "$FEAT_LINES" ]]; then
                echo ""
                echo "### 🚀 Features"
                printf '%s' "$FEAT_LINES"
              fi
              if [[ -n "$FIX_LINES" ]]; then
                echo ""
                echo "### 🐛 Fixes"
                printf '%s' "$FIX_LINES"
              fi
              if [[ -n "$OTHER_LINES" ]]; then
                echo ""
                echo "### 🔧 Other Commits"
                printf '%s' "$OTHER_LINES"
              fi
              echo ""
            fi

            echo "---"
            echo "### Downloads & Verification"
            echo "- **Windows x64:** \`.exe\` (NSIS installer) or \`.msi\` (WiX installer)"
            echo "- **macOS:** \`.dmg\` for Apple Silicon (\`aarch64\`) or Intel (\`x64\`)"
            echo "- **Linux x64:** \`.AppImage\`, \`.deb\`, or \`.rpm\`"
            echo "- Verify integrity against \`SHA256SUMS.txt\`."
          } > release-notes.md

          echo "=== Generated release-notes.md ==="
          cat release-notes.md

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          echo "Final release artifacts:"
          ls -lh
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: TrueShow ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: artifacts/*
