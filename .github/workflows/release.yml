name: Release

# Push a version tag (e.g. v0.1.0 or v0.1.0-beta.1) — or trigger manually via
# workflow_dispatch — to build cross-platform installers for Windows, macOS,
# and Linux with the decoupled `trueshow-engine` GPU sidecar bundled inside,
# and publish them to a GitHub Release with SHA256SUMS.txt.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release as (e.g. v0.1.0-beta.1). Created if it does not exist.'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Step 1: Build the `trueshow-engine` GPU sidecar and package Tauri 2
  # installers for every desktop target.
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build Installer (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            ext: '.exe'
          - os: macos-latest
            label: macOS Apple Silicon
            target: aarch64-apple-darwin
            bundles: dmg
            ext: ''
          - os: macos-latest
            label: macOS Intel
            target: x86_64-apple-darwin
            bundles: dmg
            ext: ''
          - os: ubuntu-latest
            label: Linux x64
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            ext: ''

    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag & version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> apps/desktop/src-tauri/target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux Tauri, graphics & audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libvulkan-dev \
            rpm

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build trueshow-engine sidecar (${{ matrix.target }})
        shell: bash
        run: |
          cargo build --release --bin trueshow-engine --target ${{ matrix.target }}
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/${{ matrix.target }}/release/trueshow-engine${{ matrix.ext }}" \
             "apps/desktop/src-tauri/binaries/trueshow-engine-${{ matrix.target }}${{ matrix.ext }}"

      - name: Write Tauri release config override
        shell: bash
        run: |
          cat > apps/desktop/src-tauri/release-override.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "bundle": {
              "active": true,
              "externalBin": ["binaries/trueshow-engine"]
            }
          }
          EOF

      - name: Build TrueShow installers (${{ matrix.bundles }})
        working-directory: apps/desktop
        shell: bash
        env:
          # Build unsigned in CI unless signing secrets are explicitly configured.
          CI: true
          # Avoid Ubuntu 24.04 linuxdeploy strip failure on newer ELF .relr.dyn sections.
          NO_STRIP: true
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          npx tauri build \
            --target ${{ matrix.target }} \
            --bundles ${{ matrix.bundles }} \
            --config src-tauri/release-override.json

      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          BUNDLE_DIR="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$BUNDLE_DIR" -maxdepth 2 -type f \( \
            -name "*.exe" -o \
            -name "*.msi" -o \
            -name "*.dmg" -o \
            -name "*.deb" -o \
            -name "*.rpm" -o \
            -name "*.AppImage" \
          \) -exec cp -v {} release-assets/ \;

          echo "Collected assets for ${{ matrix.label }}:"
          ls -lh release-assets/
          if [ -z "$(ls -A release-assets)" ]; then
            echo "::error::No installer artifacts found in $BUNDLE_DIR"
            exit 1
          fi

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Step 2: Generate SHA256SUMS.txt and publish the GitHub Release.
  # ───────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve tag & prerelease flag
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          echo "Final release artifacts:"
          ls -lh
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: TrueShow ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
