[package]
name = "openpresenter-desktop"
version = "0.1.0-m0"
edition = "2024"
license = "MPL-2.0"
description = "Tauri 2 operator control surface for OpenPresenter."

[lib]
name = "openpresenter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
core-ipc = { path = "../../../crates/core-ipc" }
core-scene = { path = "../../../crates/core-scene" }
interprocess = { version = "2.2", features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.16", features = ["serde"] }
