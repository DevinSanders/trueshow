[package]
name = "openpresenter-desktop"
version = "0.1.0-m1"
edition = "2024"
license = "MPL-2.0"
description = "Tauri 2 operator control surface for OpenPresenter."

[lib]
name = "openpresenter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
broadcast-io = { path = "../../../crates/broadcast-io" }
chrono = { version = "0.4", features = ["serde"] }
core-diagnostics = { path = "../../../crates/core-diagnostics" }
core-ipc = { path = "../../../crates/core-ipc" }
core-library = { path = "../../../crates/core-library" }
core-scene = { path = "../../../crates/core-scene" }
integrations = { path = "../../../crates/integrations" }
interprocess = { version = "2.2", features = ["tokio"] }
plugin-host = { path = "../../../crates/plugin-host" }
plugin-sdk = { path = "../../../crates/plugin-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
show-control = { path = "../../../crates/show-control" }
tauri = { version = "2", features = [] }
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.16", features = ["v4", "serde"] }
