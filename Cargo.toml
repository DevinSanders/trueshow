[workspace]
resolver = "3"
members = [
    "crates/core-scene",
    "crates/core-ipc",
    "crates/render-wgpu",
    "bins/engine",
]
exclude = [
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0-m0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/openpresenter/OpenPresenter"

[workspace.dependencies]
bytemuck = { version = "1.22", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
interprocess = { version = "2.2", features = ["tokio"] }
memmap2 = "0.9"
pollster = "0.4"
postcard = { version = "1.1", features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.16", features = ["v4", "serde"] }
wgpu = "30.0"
winit = "0.30"

core-scene = { path = "crates/core-scene" }
core-ipc = { path = "crates/core-ipc" }
render-wgpu = { path = "crates/render-wgpu" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
