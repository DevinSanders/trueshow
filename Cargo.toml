[workspace]
resolver = "3"
members = [
    "crates/core-diagnostics",
    "crates/core-scene",
    "crates/core-ipc",
    "crates/core-library",
    "crates/render-text",
    "crates/media-engine",
    "crates/broadcast-io",
    "crates/show-control",
    "crates/integrations",
    "crates/plugin-sdk",
    "crates/plugin-host",
    "crates/render-wgpu",
    "bins/engine",
]
exclude = [
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0-m3"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/DevinSanders/trueshow"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
blake3 = "1.8"
bytemuck = { version = "1.25", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
cosmic-text = "0.19"
cpal = "0.18"
flate2 = "1.1"
interprocess = { version = "2.4", features = ["tokio"] }
libloading = "0.9"
loro = "1.19"
memmap2 = "0.9"
midir = "0.11"
pollster = "1.0"
postcard = { version = "1.2", features = ["alloc"] }
prost = "0.14"
quick-xml = "0.42"
rosc = "0.11"
rtrb = "0.4"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
symphonia = { version = "0.6", features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
thiserror = "2.0"
tiny-skia = "0.12"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.29", features = ["v4", "serde"] }
wasmtime = { version = "51", default-features = false, features = ["runtime", "cranelift", "wat"] }
wgpu = "30.0"
winit = "0.30"
zip = { version = "9.8", default-features = false, features = ["deflate"] }

core-diagnostics = { path = "crates/core-diagnostics" }
core-scene = { path = "crates/core-scene" }
core-ipc = { path = "crates/core-ipc" }
core-library = { path = "crates/core-library" }
render-text = { path = "crates/render-text" }
media-engine = { path = "crates/media-engine" }
broadcast-io = { path = "crates/broadcast-io" }
show-control = { path = "crates/show-control" }
plugin-sdk = { path = "crates/plugin-sdk" }
render-wgpu = { path = "crates/render-wgpu" }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
